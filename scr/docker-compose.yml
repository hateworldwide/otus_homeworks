services:

  mariadb:
    image: mysql:8.0
    container_name: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: opencart
      MYSQL_USER: opencart
      MYSQL_PASSWORD: password
    ports:
      - '3306:3306'
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - selenoid

  phpadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: password
    ports:
      - '8082:80'
    depends_on:
      - mariadb
    networks:
      - selenoid

  opencart:
    image: agridyaev/opencart:4.0.2-3-debian-12-r33
    container_name: opencart
    ports:
      - '8081:8080'
    environment:
      OPENCART_DATABASE_HOST: mariadb
      OPENCART_DATABASE_PORT_NUMBER: 3306
      OPENCART_DATABASE_USER: opencart
      OPENCART_DATABASE_NAME: opencart
      OPENCART_USERNAME: admin
      OPENCART_PASSWORD: admin
      ALLOW_EMPTY_PASSWORD: yes
    depends_on:
      - mariadb
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - selenoid

  tests:
    image: opencart-tests
    container_name: opencart_tests
    working_dir: scr
    depends_on:
      opencart:
        condition: service_healthy
    command: >
      pytest -v test_part3.py
      --url opencart:8080
      --browser chrome
      --browser_version 128.0
      --executor selenoid
    networks:
      - selenoid

volumes:
  mariadb_data:

networks:
  test_network:
    name: selenoid
    external: true